[project]
name = "kirpinator"
version = "0.1.0"
description = "Fully automated AI video editing and publishing pipeline for Yagmurun Oyun Bahcesi"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
